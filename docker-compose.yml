name: opspilot

# Local stack. Every service waits for the dependencies it actually needs, and
# migrations run to completion before the API or worker start.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    # Host ports are configurable: a developer may already run Postgres locally.
    ports: ['${POSTGRES_HOST_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-opspilot_owner} -d ${POSTGRES_DB:-opspilot}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Queues are durable state until a job completes; appendonly survives restarts.
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_HOST_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.16.1
    ports: ['${QDRANT_HOST_PORT:-6333}:6333']
    volumes: ['qdrant-data:/qdrant/storage']
    # No shell or HTTP client in the image, so there is no useful healthcheck;
    # the AI service's /readyz reports Qdrant availability instead.

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: database, PKG_DIR: packages/database }
    # Two steps, in order: apply schema changes, then ensure the application
    # login role exists with the configured password.
    command: ['sh', '-c', 'node dist/cli/migrate.js && node dist/cli/provision.js']
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?}
      APP_DB_USER: ${APP_DB_USER:-opspilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: api, ENTRY: dist/server.js }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
    ports: ['${API_HOST_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: worker, ENTRY: dist/main.js }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PORT: 4100
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports: ['${WORKER_HOST_PORT:-4100}:4100']
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4100/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    ports: ['${AI_SERVICE_HOST_PORT:-8000}:8000']
    depends_on: [qdrant]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\").status==200 else 1)"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_ORIGIN: ${API_ORIGIN:-http://api:4000}
    environment:
      NODE_ENV: production
    ports: ['${WEB_HOST_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }

  # Optional local model provider: `docker compose --profile ollama up`
  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    ports: ['11434:11434']
    volumes: ['ollama-data:/root/.ollama']

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-data:
