[project]
name = "opspilot-ai"
version = "0.0.0"
description = "OpsPilot AI service: retrieval, LangGraph investigation agent and evaluations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.53.0,<0.54",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "structlog>=26.1.0,<27",
    "qdrant-client>=1.19.1,<2",
    "fastembed>=0.8.1,<0.9",
    "langgraph>=1.2.12,<2",
    "redis>=6.4.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.16.9,<0.17",
    "mypy>=2.3.1,<3",
    "testcontainers>=4.13.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff-specific
    "ASYNC",     # async pitfalls
    "S",         # bandit security rules
    "PT",        # pytest style
    "ANN",       # missing annotations
]
ignore = ["ANN401"]  # allow typing.Any where a boundary genuinely is untyped

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert is the point of a test; fake secrets are fixtures

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Docker (real Qdrant)"]
