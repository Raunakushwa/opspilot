name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --filter='!@opspilot/ai-service'
      - run: pnpm typecheck --filter='!@opspilot/ai-service'
      - run: pnpm test --filter='!@opspilot/ai-service'
      - run: pnpm build --filter='!@opspilot/ai-service'

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: 0.11.27
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts real PostgreSQL and Redis containers; the runner's
      # Docker daemon is used directly, so no service containers are declared.
      - run: pnpm test:integration

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Create .env from template
        # Values are throwaway: this stack is destroyed with the runner.
        run: |
          sed -e 's/change-me-owner-password/ci-owner-password/g' \
              -e 's/change-me-app-password/ci-app-password/g' \
              .env.example > .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Probe every service
        run: |
          set -euo pipefail
          for url in \
            http://localhost:4000/readyz \
            http://localhost:4100/readyz \
            http://localhost:8000/readyz \
            http://localhost:3000/ \
            http://localhost:3000/api/status
          do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
          done
      - name: Verify the application role cannot bypass tenant isolation
        run: |
          docker compose exec -T postgres psql -U opspilot_owner -d opspilot -tAc \
            "SELECT bool_and(NOT rolsuper AND NOT rolbypassrls) FROM pg_roles WHERE rolname = 'opspilot_app'" \
            | grep -qx 't'
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
